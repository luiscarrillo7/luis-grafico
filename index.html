<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuadros estadísticos – Lavado de activos</title>
<!-- Importamos Chart.js para visualizaciones profesionales e interactivas -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root { 
        --blue: #174d7a; 
        --blue-dark: #0f3b5d;
        --text: #1f2937; 
        --muted: #64748b; 
        --bg: #f8fafc; 
        --card: #ffffff; 
        --border: #e2e8f0; 
    }
    
    * { box-sizing: border-box; }
    
    body { 
        margin: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background: var(--bg); 
        color: var(--text); 
        line-height: 1.5;
    }
    
    header { 
        background: linear-gradient(135deg, #123f67, #2b6797); 
        color: white; 
        padding: 32px 24px; 
        text-align: center; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    header p { margin: 0; opacity: 0.9; font-size: 15px; font-weight: 300; }
    
    .wrapper { 
        max-width: 1200px; 
        margin: 32px auto; 
        padding: 0 20px; 
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
        gap: 24px;
    }
    
    .card { 
        background: var(--card); 
        border: 1px solid var(--border); 
        border-radius: 12px; 
        padding: 24px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    .card h2 { color: var(--blue); margin: 0 0 8px; font-size: 18px; line-height: 1.3; }
    .subtitle { color: var(--muted); margin: 0 0 16px; font-size: 14px; flex-grow: 0; }
    
    .note { 
        background: #f0f9ff; 
        border-left: 4px solid #0284c7; 
        padding: 12px 16px; 
        border-radius: 0 8px 8px 0; 
        font-size: 13px; 
        color: #0369a1; 
        margin-bottom: 20px; 
    }
    
    .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
        margin-bottom: 16px;
        flex-grow: 1;
        display: flex;
        justify-content: center;
    }
    
    .source { 
        margin-top: auto; 
        padding-top: 16px;
        font-size: 12px; 
        color: var(--muted); 
        border-top: 1px solid var(--border);
    }
    
    .footer { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    
    .btn-print { 
        border: 0; 
        border-radius: 8px; 
        background: var(--blue); 
        color: white; 
        padding: 12px 24px; 
        cursor: pointer; 
        font-weight: 600; 
        font-size: 14px;
        margin-top: 16px; 
        transition: background 0.2s;
    }
    
    .btn-print:hover { background: var(--blue-dark); }
    
    /* Responsive adjustments */
    @media(max-width: 600px) { 
        .wrapper { grid-template-columns: 1fr; }
        .chart-container { height: 250px; }
    }
    
    /* Estilos profesionales para impresión */
    @media print { 
        body { background: white; } 
        header { background: white; color: black; box-shadow: none; border-bottom: 2px solid black; }
        .wrapper { display: block; }
        .card { box-shadow: none; border: none; break-inside: avoid; margin-bottom: 40px; } 
        .btn-print { display: none; } 
    }
</style>
</head>
<body>

<header>
    <h1>CUADROS ESTADÍSTICOS DE HALLAZGOS</h1>
    <p>Lavado de activos · Informe Defensorial N.° 286 · Defensoría del Pueblo · julio de 2026</p>
</header>

<main class="wrapper" id="app"></main>

<div class="footer">
    Fuente base: <strong>Informe Defensorial N.° 286</strong>, Defensoría del Pueblo, julio de 2026.
    <br>
    <button class="btn-print" onclick="window.print()">
        <svg style="width:16px; height:16px; vertical-align:text-bottom; margin-right:6px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        Imprimir / Guardar como PDF
    </button>
</div>

<script>
// Datos originales
const chartsData = [{"num": "1", "title": "Cifras 100% de hallazgos de lavado de activos seccionados por entidades intervinientes", "subtitle": "Distribución visual de las cifras reportadas en los hallazgos generales. Las instituciones corresponden a etapas/unidades distintas y no deben sumarse como casos únicos.", "data": [["PNP – DIRILAED", 2643], ["Ministerio Público", 6616], ["Poder Judicial", 459], ["UIF", 1456], ["INPE", 142], ["Defensoría del Pueblo", 49], ["CSNJPE", 12]], "source": "Cuadro estadístico, apartado 1. Hallazgos generales."}, {"num": "2", "title": "Estado de las investigaciones policiales – 2026", "subtitle": "Distribución porcentual de las 394 carpetas examinadas.", "data": [["En trámite", 302], ["Con plazo vencido", 92]], "source": "Cuadro estadístico, apartado 2."}, {"num": "3", "title": "Estado procesal informado por el Ministerio Público", "subtitle": "Distribución porcentual de los 2,462 registros con etapa informada.", "data": [["Asignados a la PNP en investigación preliminar", 544], ["Investigación en sede fiscal", 36], ["Investigación preliminar fiscal", 1555], ["Formalización de investigación preparatoria", 291], ["Acusación", 14], ["Audiencia", 10], ["Sentencia", 12]], "source": "Cuadro estadístico, apartado 3."}, {"num": "4", "title": "Concentración por etapa procesal de las investigaciones", "subtitle": "Distribución porcentual sobre 2,462 registros con etapa informada.", "data": [["Etapas iniciales", 2135], ["Investigación formalizada", 291], ["Acusación", 14], ["Audiencia", 10], ["Sentencia", 12]], "source": "Cuadro estadístico, apartado 4."}, {"num": "5", "title": "Estado de los casos en FECOR y FECOF", "subtitle": "Distribución porcentual de los 573 casos con estado identificado.", "data": [["Investigación preliminar fiscal", 335], ["Investigación policial", 183], ["Formalizados", 43], ["Acusación", 2], ["Juzgamiento", 3], ["Sentencia o resolución final", 7]], "source": "Cuadro estadístico, apartado 5."}, {"num": "6", "title": "Decisiones judiciales por resultado", "subtitle": "Distribución porcentual de las 459 decisiones judiciales registradas.", "data": [["Sentencias condenatorias", 234], ["Sentencias absolutorias", 220], ["Reserva de fallo condenatorio", 5]], "source": "Cuadro estadístico, apartado 6."}, {"num": "7", "title": "Personas privadas de libertad por situación jurídica – 2026", "subtitle": "Distribución porcentual de las 142 personas privadas de libertad.", "data": [["Procesadas con prisión preventiva", 54], ["Con sentencia condenatoria", 88]], "source": "Cuadro estadístico, apartado 7."}, {"num": "8", "title": "Investigaciones fiscales por territorio, 2019–2025", "subtitle": "Participación porcentual de los 5,633 casos distribuidos por distrito fiscal o territorio.", "data": [["Lima Centro", 3152], ["Arequipa", 643], ["Puno/Juliaca", 537], ["Tacna", 372], ["Lima Norte", 351], ["Callao", 350], ["Tumbes", 116], ["Santa", 112]], "source": "Cuadro estadístico, apartado 8."}, {"num": "9", "title": "Decisiones judiciales por territorio", "subtitle": "Participación porcentual de las 459 decisiones judiciales según distrito judicial.", "data": [["Amazonas", 2], ["Áncash", 13], ["Apurímac", 6], ["Arequipa", 30], ["Ayacucho", 43], ["Cajamarca", 7], ["Callao", 39], ["Corte Superior Nacional Especializada", 49], ["Cusco", 11], ["Huancavelica", 1], ["Huánuco", 8], ["Huaura", 4], ["Ica", 1], ["Junín", 12], ["La Libertad", 16], ["Lambayeque", 6], ["Lima", 33], ["Lima Este", 1], ["Lima Norte", 11], ["Lima Sur", 3], ["Loreto", 18], ["Madre de Dios", 18], ["Moquegua", 6], ["Pasco", 3], ["Piura", 3], ["Puno", 62], ["Sala Penal Nacional", 1], ["San Martín", 2], ["Santa", 3], ["Selva Central", 3], ["Sullana", 4], ["Tacna", 25], ["Tumbes", 13], ["Ucayali", 2]], "source": "Cuadro estadístico, apartado 9."}];

// Paleta de colores más moderna y armoniosa
const modernColors = ["#1d4ed8", "#0ea5e9", "#f59e0b", "#10b981", "#8b5cf6", "#ec4899", "#f43f5e", "#06b6d4", "#64748b", "#84cc16"];

// Plugin personalizado para Chart.js para dibujar el "TOTAL" en el centro del Donut
const centerTextPlugin = {
    id: 'centerText',
    beforeDraw: function(chart) {
        if (chart.config.type !== 'doughnut') return;
        
        const ctx = chart.ctx;
        const width = chart.width;
        const height = chart.height;
        
        ctx.restore();
        
        // Sumar el total de los datos
        const total = chart.config.data.datasets[0].data.reduce((a, b) => a + b, 0).toLocaleString('es-PE');
        
        // Configuración del texto "Total numérico"
        ctx.font = "bold 20px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#1f2937";
        const textX = Math.round((width - ctx.measureText(total).width) / 2);
        const textY = height / 2 - 5;
        ctx.fillText(total, textX, textY);
        
        // Configuración de la etiqueta "TOTAL"
        ctx.font = "600 11px sans-serif";
        ctx.fillStyle = "#64748b";
        const label = "TOTAL";
        const labelX = Math.round((width - ctx.measureText(label).width) / 2);
        ctx.fillText(label, labelX, textY + 20);
        
        ctx.save();
    }
};

// Registrar el plugin en Chart.js
Chart.register(centerTextPlugin);

const app = document.getElementById('app');

// Generar el HTML y los gráficos iterando sobre los datos
chartsData.forEach((chartObj, index) => {
    // 1. Crear estructura HTML (Card)
    const card = document.createElement('article');
    card.className = 'card';
    
    // Extraer etiquetas y valores
    const labels = chartObj.data.map(item => item[0]);
    const values = chartObj.data.map(item => item[1]);
    
    // Nota metodológica exclusiva para el primer gráfico
    const noteHTML = index === 0 
        ? `<div class="note"><strong>Nota metodológica:</strong> Las cifras mostradas corresponden a actuaciones diferentes. El gráfico sirve como referencia visual de volúmenes y no representa una suma real de casos únicos.</div>` 
        : '';

    card.innerHTML = `
        <h2>${chartObj.num}. ${chartObj.title}</h2>
        <p class="subtitle">${chartObj.subtitle}</p>
        ${noteHTML}
        <div class="chart-container">
            <canvas id="chart-${index}"></canvas>
        </div>
        <div class="source">${chartObj.source}</div>
    `;
    app.appendChild(card);

    // 2. Inicializar Chart.js en el Canvas creado
    const ctx = document.getElementById(`chart-${index}`).getContext('2d');
    
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: modernColors,
                borderWidth: 2,
                borderColor: '#ffffff',
                hoverOffset: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%', // Grosor del anillo
            plugins: {
                legend: {
                    position: 'right',
                    align: 'center',
                    labels: {
                        boxWidth: 12,
                        usePointStyle: true,
                        font: { size: 12, family: 'sans-serif' },
                        color: '#475569'
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                    titleFont: { size: 13 },
                    bodyFont: { size: 14, weight: 'bold' },
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            const value = context.raw;
                            const total = context.chart._metasets[context.datasetIndex].total;
                            const percentage = ((value / total) * 100).toFixed(1) + '%';
                            return ` ${value.toLocaleString('es-PE')} casos (${percentage})`;
                        }
                    }
                }
            }
        }
    });
});
</script>
</body>
</html>
